<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#2a2a2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <filter id="fog" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 0 0.62  0 0 0 0.35 -0.08"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="fogfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fogmask"><rect width="1200" height="360" fill="url(#fogfade)"/></mask>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#6b6b70" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6b6b70" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6b6b70" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- slow drifting fog -->
  <g opacity="0.55" mask="url(#fogmask)">
    <rect x="-300" y="-40" width="1800" height="440" filter="url(#fog)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 260 0; 0 0" dur="60s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- horizon -->
  <rect x="150" y="268" width="900" height="1" fill="url(#line)"/>

  <!-- wordmark -->
  <text x="600" y="186" text-anchor="middle" font-family="'Cormorant Garamond','Didot','Bodoni 72',Georgia,serif" font-size="108" font-weight="300" letter-spacing="26" dx="13" fill="#d6d6d8">
    NICOORA
    <animate attributeName="fill-opacity" values="0.82;1;0.82" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="234" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="7" dx="3.5" fill="#7a7a80">
    C-SUITE BUSINESS DEVELOPER
  </text>
  <text x="600" y="300" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="5" dx="2.5" fill="#4a4a50">
    STRATEGY · SYSTEMS · SILENCE
  </text>

  <rect width="1200" height="360" fill="url(#vignette)"/>
  <rect width="1200" height="360" filter="url(#grain)"/>
</svg>
